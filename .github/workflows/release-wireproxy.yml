name: Release WARP-compatible WireProxy

on:
  push:
    tags:
      - wireproxy-warp-v*

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.0
      - name: Build and test WireProxy
        run: |
          git clone https://github.com/windtf/wireproxy.git /tmp/wireproxy
          git -C /tmp/wireproxy checkout 31a9a34498267d7fb8aeff05aba79d929b15eb39
          git -C /tmp/wireproxy apply "$GITHUB_WORKSPACE/patches/wireproxy-warp-reserved.patch"
          cd /tmp/wireproxy
          go test ./...
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#wireproxy-warp-v}" -o wireproxy ./cmd/wireproxy
            tar -czf "$GITHUB_WORKSPACE/wireproxy_linux_${arch}.tar.gz" wireproxy
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" wireproxy_linux_amd64.tar.gz wireproxy_linux_arm64.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
